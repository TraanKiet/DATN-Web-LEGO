<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kietstoree</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 1. HEADER -->
    <header class="main-header">
      <div class="logo">
        <a href="#">LOGO</a>
      </div>
      <nav class="nav-menu">
        <ul>
          <li><a href="#" class="active">Mảnh LEGO</a></li>
          <li><a href="#">LEGO Theo bộ</a></li>
          <li><a href="#">Nhân vật</a></li>
          <li><a href="#">Về chúng tôi</a></li>
        </ul>
      </nav>
      <div class="header-tools">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Tìm kiếm sản phẩm..." />
        </div>
        <a href="#" class="tool-icon" title="Giỏ hàng">
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
        <a href="#" class="tool-icon" title="Tài khoản">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
    </header>
    <!-- 2. MAIN -->
    <main class="content-container">
      <div id="product-container" class="product-grid">
        <!-- JavaScript sẽ đổ 10 hoặc 15 sản phẩm vào đây -->
      </div>
      <!-- Đường kẻ ngăn cách như bản vẽ -->
      <hr class="divider" />
      <!-- 3. THANH PHÂN TRANG -->
      <div id="pagination" class="pagination">
        <!-- Nút phân trang sẽ được render bằng JS -->
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
